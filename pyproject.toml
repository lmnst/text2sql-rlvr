[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "text2sql-rlvr"
version = "0.1.0"
description = "Execution-grounded RLVR for Text-to-SQL"
requires-python = ">=3.10"
# Kept deliberately thin: everything in src/ must run on a laptop with sqlite
# and no torch. Training-side dependencies live in requirements-train.txt.
dependencies = [
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# E501 is not in ruff's default set, so line-length above would otherwise be
# decorative. B catches the mutable-default and loop-variable-capture bugs.
select = ["E", "F", "W", "I", "B", "UP"]

